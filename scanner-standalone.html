<html lang="en">

<script>
function loadZXingFallback(){
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
  s.onload=function(){window._zxingLoaded=true};
  s.onerror=function(){window._zxingError=true};
  document.head.appendChild(s);
}

<style>
:root{--bg:#060912;--card:#111827;--el:#1a2438;--br:rgba(99,130,190,.18);--brhi:rgba(99,130,190,.35);--blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--amber:#f59e0b;--red:#f43f5e;--txt:#f1f5ff;--txt2:#94a3c8;--dim:#4a5578;--m:'DM Mono','Courier New',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
.shell{display:flex;flex-direction:column;min-height:100vh}
.hdr{position:sticky;top:0;z-index:90;padding:12px 16px;background:rgba(6,9,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.hdr-logo{font-weight:800;font-size:1rem;letter-spacing:-.02em}
.hdr-logo span{color:var(--cyan)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-family:var(--m);font-size:.65rem;font-weight:600;letter-spacing:.06em;background:rgba(74,85,120,.15);border:1px solid var(--br);color:var(--dim);transition:all .3s}
.badge.on{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:var(--green)}
.badge.err{background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.3);color:var(--red)}
.bdot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:all .3s}
.badge.on .bdot{background:var(--green);box-shadow:0 0 7px var(--green);animation:blink 1.8s ease-in-out infinite}
.badge.err .bdot{background:var(--red);box-shadow:0 0 6px var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.vp{position:relative;width:100%;background:#000;overflow:hidden;flex-shrink:0;height:min(62vw,340px);max-height:340px}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#canvas{display:none}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.idle-icon{width:72px;height:72px;border-radius:50%;background:rgba(99,130,190,.07);border:2px dashed var(--br);display:flex;align-items:center;justify-content:center;font-size:2rem}
.idle-title{font-weight:700;font-size:.95rem;color:var(--txt2)}
.idle-sub{font-size:.76rem;color:var(--dim);line-height:1.6;max-width:260px}
.ovl{display:none;position:absolute;inset:0;pointer-events:none}
.mask-svg{position:absolute;inset:0;width:100%;height:100%}
.bkw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.bkb{position:relative;width:58%;max-width:220px;aspect-ratio:3/2}
.c{position:absolute;width:26px;height:26px;border:3px solid var(--cyan)}
.tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:4px 0 0 0}
.tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 4px 0 0}
.bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 4px}
.br2{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 4px 0}
.sl{position:absolute;left:0;right:0;height:2px;top:0;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 10px var(--cyan);animation:sl 2s ease-in-out infinite}
@keyframes sl{0%{top:2px;opacity:1}50%{top:calc(100% - 4px);opacity:.55}100%{top:2px;opacity:1}}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center}
.hint span{background:rgba(0,0,0,.6);backdrop-filter:blur(5px);padding:4px 14px;border-radius:99px;font-family:var(--m);font-size:.63rem;color:rgba(148,163,184,.9);letter-spacing:.07em}
.flash{display:none;position:absolute;inset:0;background:rgba(16,185,129,.38);animation:fl .38s ease forwards;pointer-events:none}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.diag{margin:10px 16px 0;padding:11px 14px;border-radius:10px;font-size:.78rem;line-height:1.65;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);color:var(--txt2)}
.diag.ok{background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.25);color:#6ee7b7}
.diag.warn{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.25);color:#fbbf24}
.diag.err{background:rgba(244,63,94,.07);border-color:rgba(244,63,94,.25);color:#fb7185}
.diag b{display:block;font-weight:700;margin-bottom:3px}
.diag a{color:var(--cyan)}
.diag code{font-family:var(--m);font-size:.7rem;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px}
.ctrl{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--br)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:11px;font-size:.9rem;font-weight:700;border:none;cursor:pointer;transition:all .18s;outline:none;-webkit-appearance:none;flex:1}
.btn-main{background:var(--blue);color:#fff;box-shadow:0 0 20px rgba(59,130,246,.28)}
.btn-main:active{transform:scale(.97);background:#2563eb}
.btn-main.stop{background:var(--red);box-shadow:0 0 20px rgba(244,63,94,.22)}
.btn-flip{flex:0;padding:11px 14px;background:rgba(99,130,190,.1);border:1px solid var(--br);color:var(--txt2);border-radius:11px;font-size:.9rem;cursor:pointer;display:none;font-weight:700}
.cam-row{display:none;padding:0 16px 12px}
.cam-sel{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--br);border-radius:9px;color:var(--txt);font-size:.84rem;outline:none;appearance:none;-webkit-appearance:none}
.result{display:none;margin:12px 16px 0;padding:14px 15px;border-radius:12px;border:1px solid rgba(16,185,129,.3);background:rgba(16,185,129,.06);animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(5px)}}
.result.unk{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.06)}
.r-code{font-family:var(--m);font-size:.67rem;color:var(--dim);margin-bottom:3px}
.r-name{font-weight:700;font-size:1rem;color:var(--green);margin-bottom:8px}
.result.unk .r-name{color:var(--amber)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:99px;font-family:var(--m);font-size:.63rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ck-ok{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25)}
.ck-am{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25)}
.ck-rd{background:rgba(244,63,94,.12);color:var(--red);border:1px solid rgba(244,63,94,.25)}
.ck-cy{background:rgba(6,182,212,.12);color:var(--cyan);border:1px solid rgba(6,182,212,.25)}
.ck-bl{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.25)}
.ck-d{background:rgba(74,85,120,.12);color:var(--dim);border:1px solid var(--br)}
.acts{display:none;padding:10px 16px 0}
.acts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{padding:11px 8px;border-radius:10px;border:1px solid var(--br);background:rgba(99,130,190,.06);color:var(--txt2);font-size:.82rem;font-weight:600;cursor:pointer;text-align:center;transition:all .18s}
.act:active{transform:scale(.97)}
.act.in{border-color:rgba(16,185,129,.3);color:var(--green);background:rgba(16,185,129,.07)}
.act.out{border-color:rgba(244,63,94,.3);color:var(--red);background:rgba(244,63,94,.07)}
.act.chk{border-color:rgba(6,182,212,.3);color:var(--cyan);background:rgba(6,182,212,.07)}
.act.ld{border-color:rgba(59,130,246,.3);color:#60a5fa;background:rgba(59,130,246,.07)}
.man{display:flex;gap:8px;padding:12px 16px}
.man input{flex:1;padding:10px 13px;background:var(--card);border:1px solid var(--br);border-radius:10px;color:var(--txt);font-size:.88rem;outline:none;-webkit-appearance:none;transition:border-color .2s}
.man input:focus{border-color:var(--blue)}
.man input::placeholder{color:var(--dim)}
.man button{padding:10px 14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer}
.man button:active{background:#2563eb}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.hist-title{font-size:.78rem;font-weight:700;color:var(--txt2);letter-spacing:.04em}
.hist-clr{font-size:.72rem;color:var(--dim);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}
.hist{padding:0 16px 80px}
.hi{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(99,130,190,.07);animation:up .18s ease}
.hi:last-child{border-bottom:none}
.hid{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.hib{flex:1;min-width:0}
.hin{font-weight:600;font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hic{font-family:var(--m);font-size:.63rem;color:var(--dim);margin-top:1px}
.hit{font-family:var(--m);font-size:.62rem;color:var(--dim);flex-shrink:0}
.hist-empty{text-align:center;padding:28px 16px;color:var(--dim);font-size:.82rem}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--el);border:1px solid var(--brhi);color:var(--txt);padding:11px 18px;border-radius:10px;font-size:.83rem;font-weight:600;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90vw;text-align:center;animation:up .25s ease}
@supports (padding-bottom:env(safe-area-inset-bottom)){.hist{padding-bottom:calc(80px + env(safe-area-inset-bottom))}}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--brhi);border-radius:2px}
</style>
</head>
<body>
<div class="shell">
<header class="hdr">
  <div class="hdr-logo">🍽 Appetina <span>SCAN</span></div>
  <div class="hdr-right">
    <div class="badge" id="badge"><div class="bdot" id="bdot"></div><span id="btxt">IDLE</span></div>
  </div>
</header>

<div class="vp">
  <div class="idle" id="idle">
    <div class="idle-icon" id="idleIcon">📷</div>
    <div class="idle-title" id="idleTitle">Tap Start Camera</div>
    <div class="idle-sub" id="idleSub">Point your phone rear camera at any barcode. QR · EAN-13 · UPC · Code 128 · Code 39</div>
  </div>
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="ovl" id="ovl">
    <svg class="mask-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><mask id="hole"><rect width="100" height="100" fill="white"/><rect x="21" y="16" width="58" height="68" rx="2" fill="black"/></mask></defs>
      <rect width="100" height="100" fill="rgba(0,0,0,.5)" mask="url(#hole)"/>
    </svg>
    <div class="bkw"><div class="bkb"><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br2"></div><div class="sl"></div></div></div>
    <div class="hint"><span>AIM BARCODE AT BOX</span></div>
  </div>
  <div class="flash" id="flash"></div>
</div>

<div class="diag" id="diag"><b>Ready</b>Tap <strong>Start Camera</strong> — allow camera when your browser asks.</div>

<div class="ctrl">
  <button class="btn btn-main" id="startBtn" onclick="toggleCam()">📷 Start Camera</button>
  <button class="btn-flip" id="flipBtn" onclick="flipCam()">🔄</button>
</div>
<div class="cam-row" id="camRow"><select class="cam-sel" id="camSel" onchange="switchCam(this.value)"></select></div>

<div class="result" id="result">
  <div class="r-code" id="rCode"></div>
  <div class="r-name" id="rName"></div>
  <div class="chips" id="rChips"></div>
</div>

<div class="acts" id="acts">
  <div class="acts-grid">
    <div class="act in" onclick="doAct('in')">📥 Stock IN</div>
    <div class="act out" onclick="doAct('out')">📤 Stock OUT</div>
    <div class="act chk" onclick="doAct('chk')">🔍 Check Qty</div>
    <div class="act ld" onclick="doAct('ld')">🚐 Load Event</div>
  </div>
</div>

<div class="man">
  <input id="manInp" type="text" inputmode="text" autocomplete="off" placeholder="Type SKU, barcode, or item name…" onkeydown="if(event.key==='Enter'){manSearch();event.preventDefault()}">
  <button onclick="manSearch()">🔍</button>
</div>

<div class="hist-hdr">
  <div class="hist-title">SCAN LOG</div>
  <button class="hist-clr" onclick="clearHist()">Clear</button>
</div>
<div class="hist" id="hist">
  <div class="hist-empty" id="histEmpty">Scanned items appear here</div>
</div>
</div>

<script>
const INV=[
  {id:'INV001',name:'Chicken Breast',sku:'CHKN-BR-001',unit:'kg',cost:280,qty:45,reorder:20,cat:'Meat',loc:'Kitchen Cold Storage'},
  {id:'INV002',name:'Jasmine Rice (50kg)',sku:'RICE-JAS-50',unit:'bag',cost:2100,qty:8,reorder:10,cat:'Grains',loc:'Main Warehouse'},
  {id:'INV003',name:'Pork Belly',sku:'PORK-BLY-001',unit:'kg',cost:320,qty:28,reorder:15,cat:'Meat',loc:'Kitchen Cold Storage'},
  {id:'INV004',name:'Fresh Tomatoes',sku:'VEG-TOM-001',unit:'kg',cost:65,qty:12,reorder:15,cat:'Veg',loc:'Kitchen Cold Storage'},
  {id:'INV005',name:'Cooking Oil (18L)',sku:'OIL-COOK-18',unit:'bottle',cost:1800,qty:6,reorder:4,cat:'Pantry',loc:'Kitchen Dry Storage'},
  {id:'INV006',name:'Shrimp (frozen)',sku:'SEA-SHMP-001',unit:'kg',cost:560,qty:5,reorder:8,cat:'Seafood',loc:'Kitchen Cold Storage'},
  {id:'INV007',name:'Garlic',sku:'VEG-GARL-001',unit:'kg',cost:120,qty:18,reorder:5,cat:'Veg',loc:'Main Warehouse'},
  {id:'INV008',name:'Onions',sku:'VEG-ONI-001',unit:'kg',cost:55,qty:22,reorder:10,cat:'Veg',loc:'Main Warehouse'},
  {id:'INV009',name:'All-Purpose Flour',sku:'DRY-FLOUR-01',unit:'kg',cost:58,qty:35,reorder:20,cat:'Dry',loc:'Main Warehouse'},
  {id:'INV010',name:'Butter (unsalted)',sku:'DAIRY-BUT-01',unit:'kg',cost:680,qty:8,reorder:4,cat:'Dairy',loc:'Kitchen Cold Storage'},
  {id:'INV011',name:'Coconut Milk',sku:'COND-COCO-01',unit:'can',cost:45,qty:48,reorder:24,cat:'Pantry',loc:'Kitchen Dry Storage'},
  {id:'INV012',name:'Soy Sauce (1L)',sku:'COND-SOY-1L',unit:'bottle',cost:85,qty:18,reorder:10,cat:'Condiment',loc:'Kitchen Dry Storage'},
  {id:'INV013',name:'Pandan Leaves',sku:'VEG-PAND-001',unit:'bundle',cost:35,qty:15,reorder:6,cat:'Veg',loc:'Main Warehouse'},
  {id:'INV014',name:'Lemon',sku:'VEG-LEM-001',unit:'pcs',cost:8,qty:80,reorder:40,cat:'Veg',loc:'Main Warehouse'},
  {id:'INV015',name:'White Sugar',sku:'DRY-SUG-001',unit:'kg',cost:72,qty:25,reorder:10,cat:'Dry',loc:'Kitchen Dry Storage'},
];

const CAM={stream:null,rafId:null,reader:null,devices:[],currentId:null,active:false,lastCode:null,lastTime:0,cooldown:2000};
let foundItem=null,scanHistory=[];
const g=id=>document.getElementById(id);
const el={vid:g('vid'),canvas:g('canvas'),ovl:g('ovl'),idle:g('idle'),flash:g('flash'),badge:g('badge'),bdot:g('bdot'),btxt:g('btxt'),diag:g('diag'),startBtn:g('startBtn'),flipBtn:g('flipBtn'),camRow:g('camRow'),camSel:g('camSel'),result:g('result'),rCode:g('rCode'),rName:g('rName'),rChips:g('rChips'),acts:g('acts'),hist:g('hist'),histEmpty:g('histEmpty')};

window.addEventListener('DOMContentLoaded',()=>{
  const proto=location.protocol,host=location.hostname;
  if(proto==='file:'){
    setDiag('err','Opened as local file — camera blocked','Camera requires HTTPS. Upload this file to GitHub and open it at:<br><a href="https://resitch-source.github.io/Appetina.MobileApps/scanner-standalone.html">resitch-source.github.io/Appetina.MobileApps/scanner-standalone.html</a><br><br>While setting that up, use <strong>Manual Entry</strong> below.');
    lockBtn('📁 Upload to GitHub Pages');return;
  }
  const secure=proto==='https:'||host==='localhost'||host==='127.0.0.1';
  if(!secure){
    setDiag('err','HTTP not allowed — camera blocked','Browsers block camera on HTTP. Open this page on HTTPS (GitHub Pages is free and automatically HTTPS).');
    lockBtn('🔒 Needs HTTPS');return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    setDiag('err','Camera API not supported','Try Chrome on Android or Safari iOS 15+.');
    lockBtn('❌ Browser unsupported');return;
  }
  setDiag('ok','Ready to scan','Tap <strong>Start Camera</strong>. Your browser will ask for camera permission — tap <strong>Allow</strong>.');
});

async function toggleCam(){CAM.active?stopCam():await startCam()}

async function startCam(){
  el.startBtn.textContent='⏳ Starting…';el.startBtn.disabled=true;
  setStatus('starting');
  setDiag('','Requesting camera…','Tap <b>Allow</b> when your browser asks for permission.');

  // Wait for ZXing CDN to load (max 5 seconds)
  let t=0;
  while(!window.ZXing&&!window._zxingError&&t<50){await sleep(100);t++;}
  if(!window.ZXing){
    camErr('ZXing library failed to load','Check your internet connection and reload. If problem persists, try: <a href="https://cdnjs.cloudflare.com" target="_blank">different network</a>.');
    return;
  }

  // Build synchronous ZXing reader
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    CAM.reader=new ZXing.MultiFormatReader();
    CAM.reader.setHints(hints);
  }catch(e){camErr('ZXing init failed',e.message);return;}

  // Enumerate cameras (need a temp stream first to unlock labels on Safari)
  try{
    const tmp=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    tmp.getTracks().forEach(t=>t.stop());
    const devs=await navigator.mediaDevices.enumerateDevices();
    CAM.devices=devs.filter(d=>d.kind==='videoinput');
    if(CAM.devices.length>1){
      el.camSel.innerHTML=CAM.devices.map((d,i)=>'<option value="'+d.deviceId+'">'+(d.label||'Camera '+(i+1))+'</option>').join('');
      el.camRow.style.display='block';
      el.flipBtn.style.display='flex';
    }
  }catch(_){}

  // Prefer rear camera
  const back=CAM.devices.find(d=>/back|rear|environment/i.test(d.label));
  CAM.currentId=back?back.deviceId:null;
  if(el.camSel&&CAM.currentId)el.camSel.value=CAM.currentId;

  // getUserMedia — try rear camera first, fallback to any camera
  let stream;
  const constraints=CAM.currentId
    ?{video:{deviceId:{exact:CAM.currentId},width:{ideal:1280},height:{ideal:720}},audio:false}
    :{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false};
  try{stream=await navigator.mediaDevices.getUserMedia(constraints);}
  catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}catch(e2){handleGUMErr(e2);return;}}

  CAM.stream=stream;
  el.vid.srcObject=stream;

  // Wait for video metadata
  await new Promise((res)=>{el.vid.onloadedmetadata=res;setTimeout(res,4000);});
  try{await el.vid.play();}catch(_){}

  el.canvas.width=el.vid.videoWidth||640;
  el.canvas.height=el.vid.videoHeight||480;

  el.vid.style.display='block';
  el.idle.style.display='none';
  el.ovl.style.display='block';
  CAM.active=true;

  el.startBtn.textContent='⏹ Stop Camera';
  el.startBtn.classList.add('stop');
  el.startBtn.disabled=false;
  setStatus('scanning');
  setDiag('ok','Camera live — scanning','Point at a barcode. The scanner reads every frame automatically. Beep + vibration on each scan.');
  decodeLoop();
}

function decodeLoop(){
  if(!CAM.active)return;
  const ctx=el.canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(el.vid,0,0,el.canvas.width,el.canvas.height);
  try{
    const img=ctx.getImageData(0,0,el.canvas.width,el.canvas.height);
    const lum=new ZXing.RGBLuminanceSource(img.data,el.canvas.width,el.canvas.height);
    const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
    const res=CAM.reader.decode(bmp);
    if(res)onDecoded(res.getText(),res.getBarcodeFormat());
  }catch(e){
    // NotFoundException on every empty frame is normal — suppress it
    if(e&&e.name!=='NotFoundException'&&!(e instanceof ZXing.NotFoundException)&&!CAM._errLogged){
      console.warn('[decode]',e.message);CAM._errLogged=true;
    }
  }
  CAM.rafId=setTimeout(()=>requestAnimationFrame(decodeLoop),150);
}

function stopCam(){
  CAM.active=false;
  if(CAM.rafId){clearTimeout(CAM.rafId);CAM.rafId=null;}
  if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;}
  el.vid.srcObject=null;el.vid.style.display='none';
  el.idle.style.display='flex';el.ovl.style.display='none';
  el.camRow.style.display='none';el.flipBtn.style.display='none';
  el.startBtn.textContent='📷 Start Camera';el.startBtn.classList.remove('stop');el.startBtn.disabled=false;
  g('idleIcon').textContent='📷';g('idleTitle').textContent='Tap Start Camera';g('idleSub').textContent='Point your phone rear camera at any barcode. QR · EAN-13 · UPC · Code 128 · Code 39';
  setStatus('idle');setDiag('ok','Stopped','Tap <strong>Start Camera</strong> to scan again.');
  CAM.currentId=null;CAM.devices=[];
}

async function flipCam(){
  if(!CAM.active||CAM.devices.length<2)return;
  const i=CAM.devices.findIndex(d=>d.deviceId===CAM.currentId);
  const next=CAM.devices[(i+1)%CAM.devices.length];
  await switchCam(next.deviceId);
}

async function switchCam(id){
  if(!CAM.active)return;
  if(CAM.rafId){clearTimeout(CAM.rafId);CAM.rafId=null;}
  if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null;}
  CAM.currentId=id;if(el.camSel)el.camSel.value=id;
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id}},audio:false});
    CAM.stream=s;el.vid.srcObject=s;
    await new Promise(res=>{el.vid.onloadedmetadata=res;setTimeout(res,3000);});
    try{await el.vid.play();}catch(_){}
    el.canvas.width=el.vid.videoWidth||640;el.canvas.height=el.vid.videoHeight||480;
    decodeLoop();
  }catch(e){camErr('Camera switch failed',e.message);}
}

function onDecoded(rawCode,fmt){
  const now=Date.now();
  if(rawCode===CAM.lastCode&&now-CAM.lastTime<CAM.cooldown)return;
  CAM.lastCode=rawCode;CAM.lastTime=now;
  if(navigator.vibrate)navigator.vibrate([60,30,60]);
  beep();
  el.flash.style.display='block';el.flash.style.animation='none';void el.flash.offsetWidth;
  el.flash.style.animation='fl .38s ease forwards';setTimeout(()=>el.flash.style.display='none',400);
  const fmtStr=fmtName(fmt);
  const item=findItem(rawCode);
  showResult(rawCode,fmtStr,item);
  pushHist(rawCode,fmtStr,item);
}

function fmtName(f){
  if(typeof f==='string')return f;
  const m={0:'AZTEC',1:'CODABAR',2:'CODE_39',3:'CODE_93',4:'CODE_128',5:'DATA_MATRIX',6:'EAN_8',7:'EAN_13',8:'ITF',9:'MAXICODE',10:'PDF_417',11:'QR_CODE',12:'RSS_14',14:'UPC_A',15:'UPC_E'};
  return m[f]||'BARCODE';
}

function handleGUMErr(err){
  const m={
    NotAllowedError:{t:'Camera permission denied',b:'<strong>iPhone:</strong> Settings → Safari → Camera → Allow<br><strong>Android:</strong> Tap lock icon in address bar → Camera → Allow<br><br>Then reload this page and tap Start Camera again.'},
    NotFoundError:{t:'No camera found',b:'No camera detected on this device. Use Manual Entry below.'},
    NotReadableError:{t:'Camera in use by another app',b:'Close your camera app or any video call, then try again.'},
    OverconstrainedError:{t:'Camera constraint error',b:'Tap Start Camera again — it will retry with any available camera.'},
    AbortError:{t:'Camera startup cancelled',b:'Tap Start Camera to try again.'},
    SecurityError:{t:'Security block',b:'Make sure this page is served over HTTPS.'},
  };
  const e=m[err.name]||{t:'Camera error: '+err.name,b:err.message};
  camErr(e.t,e.b);
}

function camErr(title,body){
  CAM.active=false;
  el.startBtn.textContent='📷 Start Camera';el.startBtn.classList.remove('stop');el.startBtn.disabled=false;
  setStatus('error');setDiag('err',title,body);
  g('idleIcon').textContent='🚫';g('idleTitle').textContent=title;g('idleSub').innerHTML=body.replace(/<[^>]+>/g,' ');
}

function setStatus(s){
  const m={idle:{cls:'',t:'IDLE'},starting:{cls:'',t:'STARTING'},scanning:{cls:'on',t:'LIVE'},error:{cls:'err',t:'ERROR'}};
  const r=m[s]||m.idle;
  el.badge.className='badge '+r.cls;el.btxt.textContent=r.t;
}
function setDiag(type,title,body){el.diag.className='diag '+type;el.diag.innerHTML='<b>'+title+'</b>'+body;}
function lockBtn(label){el.startBtn.textContent=label;el.startBtn.disabled=true;el.startBtn.style.opacity='.5';}

function findItem(code){
  const q=code.toLowerCase().trim();
  return INV.find(i=>i.sku===code||i.id===code||i.sku.toLowerCase()===q||i.name.toLowerCase().includes(q))||null;
}

function showResult(code,fmt,item){
  foundItem=item;
  el.rCode.textContent=code+' · '+fmt;
  el.result.style.display='block';
  if(item){
    el.result.className='result';el.rName.textContent=item.name;
    const[sl,sc]=item.qty<=0?['OUT OF STOCK','ck-rd']:item.qty<=item.reorder?['LOW STOCK','ck-am']:['IN STOCK','ck-ok'];
    el.rChips.innerHTML='<span class="chip '+sc+'">'+sl+'</span><span class="chip ck-cy">📦 '+item.qty+' '+item.unit+'</span><span class="chip ck-bl">₱'+item.cost+'/'+item.unit+'</span><span class="chip ck-d">'+item.cat+'</span><span class="chip ck-d">📍 '+item.loc+'</span>';
    el.acts.style.display='block';
  }else{
    el.result.className='result unk';el.rName.textContent='— Not in inventory —';
    el.rChips.innerHTML='<span class="chip ck-am">UNKNOWN ITEM</span><button onclick="promptAdd(\''+code+'\')" style="padding:3px 10px;border-radius:99px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.1);color:#60a5fa;font-size:.63rem;font-weight:700;cursor:pointer;font-family:var(--m)">+ ADD ITEM</button>';
    el.acts.style.display='none';
  }
}

function doAct(type){
  const item=foundItem;if(!item)return;
  if(type==='chk'){const s=item.qty<=0?'OUT OF STOCK':item.qty<=item.reorder?'LOW':'OK';alert(item.name+'\n\nStock: '+item.qty+' '+item.unit+'\nReorder: '+item.reorder+' '+item.unit+'\nStatus: '+s+'\nLocation: '+item.loc);return;}
  if(type==='ld'){showToast('🚐 "'+item.name+'" logged for event load-out');return;}
  const label=type==='in'?'Stock IN (+)':'Stock OUT (−)';
  const raw=prompt(label+'\n'+item.name+'\nCurrent: '+item.qty+' '+item.unit+'\n\nEnter quantity:');
  if(!raw)return;const qty=parseFloat(raw);if(isNaN(qty)||qty<=0){alert('Enter a valid positive number.');return;}
  if(type==='in'){item.qty+=qty;showToast('📥 +'+qty+' '+item.unit+' → '+item.name+' (now '+item.qty+')');}
  else{if(qty>item.qty){alert('Cannot remove '+qty+' — only '+item.qty+' in stock.');return;}item.qty-=qty;showToast('📤 −'+qty+' '+item.unit+' → '+item.name+' (now '+item.qty+')');}
  showResult(item.sku,'SKU',item);
}

function promptAdd(code){alert('Add item with barcode: '+code+'\n\nIn production this pre-fills the Add Item form and saves to your Google Sheet via GAS backend.');}

function manSearch(){
  const val=g('manInp').value.trim();if(!val)return;
  const item=findItem(val);showResult(val,'Manual',item);pushHist(val,'Manual',item);
  g('manInp').value='';g('manInp').blur();
}

function pushHist(code,fmt,item){
  const time=new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  scanHistory.unshift({code,fmt,item,time});renderHist();
}
function renderHist(){
  if(!scanHistory.length){el.histEmpty.style.display='block';el.hist.innerHTML='';el.hist.appendChild(el.histEmpty);return;}
  el.histEmpty.style.display='none';
  el.hist.innerHTML=scanHistory.slice(0,50).map(h=>{
    const dot=h.item?(h.item.qty<=h.item.reorder?'var(--amber)':'var(--green)'):'var(--dim)';
    return '<div class="hi"><div class="hid" style="background:'+dot+'"></div><div class="hib"><div class="hin">'+(h.item?h.item.name:h.code)+'</div><div class="hic">'+h.code+' · '+h.fmt+'</div></div><div class="hit">'+h.time+'</div></div>';
  }).join('');
}
function clearHist(){scanHistory=[];renderHist();}

let _hid='',_hidT=null;
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement&&document.activeElement.tagName))return;
  if(e.key==='Enter'&&_hid.length>2){const item=findItem(_hid.trim());showResult(_hid.trim(),'USB-HID',item);pushHist(_hid.trim(),'USB-HID',item);_hid='';}
  else if(e.key.length===1){_hid+=e.key;clearTimeout(_hidT);_hidT=setTimeout(()=>_hid='',100);}
});

function beep(){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g2=ctx.createGain();o.connect(g2);g2.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(1760,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.12);g2.gain.setValueAtTime(0.22,ctx.currentTime);g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);o.start();o.stop(ctx.currentTime+0.2);}catch(_){}
}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s ease';setTimeout(()=>t.remove(),300);},2800);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
</script>
