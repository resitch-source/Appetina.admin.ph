<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0f0a06"/>
<title>Appetina Driver</title>
<link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkFwcGV0aW5hIERyaXZlciIsCiAgInNob3J0X25hbWUiOiAiRHJpdmVyIiwKICAic3RhcnRfdXJsIjogIi4vZHJpdmVyLmh0bWwiLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiMwZjBhMDYiLAogICJ0aGVtZV9jb2xvciI6ICIjMGYwYTA2Igp9"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0f0a06; --surface:#1a1209; --card:#241a0e; --border:#3d2410;
    --gold:#C9A84C; --text:#f5ede0; --muted:#9b8068; --green:#7cb342; --red:#ef5350;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; flex-direction:column;
  }
  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:1rem 1.25rem; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .brand{ font-weight:800; color:var(--gold); font-size:1.1rem; letter-spacing:0.02em; }
  .wrap{ flex:1; padding:1.25rem; max-width:560px; margin:0 auto; width:100%; }

  .status-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:1.5rem; text-align:center; margin-bottom:1.25rem;
  }
  .pulse-dot{
    width:14px; height:14px; border-radius:50%; display:inline-block; margin-right:8px;
    vertical-align:middle; background:var(--muted);
  }
  .pulse-dot.live{ background:var(--green); animation:pulse 1.5s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(124,179,66,0.6);} 70%{box-shadow:0 0 0 12px rgba(124,179,66,0);} 100%{box-shadow:0 0 0 0 rgba(124,179,66,0);} }
  .status-text{ font-size:1.15rem; font-weight:700; margin-bottom:0.35rem; }
  .status-sub{ font-size:0.82rem; color:var(--muted); }

  .big-btn{
    width:100%; border:none; border-radius:14px; padding:1.15rem; font-size:1.1rem;
    font-weight:800; cursor:pointer; font-family:inherit; margin-bottom:1rem; transition:transform 0.1s;
  }
  .big-btn:active{ transform:scale(0.98); }
  .btn-start{ background:var(--green); color:#fff; }
  .btn-stop{ background:var(--red); color:#fff; }

  .info-row{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:1rem 1.15rem; margin-bottom:0.7rem;
  }
  .info-label{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:0.25rem; }
  .info-value{ font-size:1rem; font-weight:600; }

  .stop{
    display:flex; align-items:center; gap:0.85rem; background:var(--card);
    border:1px solid var(--border); border-radius:12px; padding:0.9rem 1rem; margin-bottom:0.6rem;
  }
  .stop-num{
    width:30px; height:30px; border-radius:50%; background:var(--gold); color:var(--bg);
    display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; font-size:0.85rem;
  }
  .section-title{ font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--gold); margin:1.5rem 0 0.7rem; font-weight:700; }

  .gps-readout{ font-size:0.72rem; color:var(--muted); text-align:center; margin-top:0.75rem; font-family:ui-monospace,monospace; }
  .err{ background:rgba(239,83,80,0.15); border:1px solid var(--red); color:#ffb4b0; padding:1rem; border-radius:12px; text-align:center; margin-bottom:1rem; font-size:0.9rem; }
  .center-msg{ text-align:center; padding:3rem 1rem; color:var(--muted); }
  .spinner{ width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  a.maplink{ color:var(--gold); text-decoration:none; font-size:0.8rem; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">🚚 Appetina Driver</span>
    <span id="netStatus" style="font-size:0.75rem;color:var(--muted);">●&nbsp;online</span>
  </div>

  <div class="wrap">
    <div id="content">
      <div class="center-msg"><div class="spinner"></div>Loading your delivery…</div>
    </div>
  </div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgiIM1LfbujitaT3an4egn1NS9bH5Ll3FmjtiHaohmLNHtl0EV1fuB5W-InqNdUUvI/exec';

// Read deliveryId + driverId from URL (?d=DEL-000001&k=DRV-XXXXXX)
const params = new URLSearchParams(location.search);
const DELIVERY_ID = params.get('d') || params.get('deliveryId') || '';
const DRIVER_ID   = params.get('k') || params.get('driverId') || '';

let _tracking = false;
let _watchId = null;
let _sendTimer = null;
let _lastFix = null;
let _delivery = null;
let _stops = [];
let UPDATE_MS = 20000; // 20s default

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

window.addEventListener('online',  ()=>{ el('netStatus').innerHTML='●&nbsp;online'; el('netStatus').style.color='var(--muted)'; });
window.addEventListener('offline', ()=>{ el('netStatus').innerHTML='●&nbsp;offline'; el('netStatus').style.color='var(--red)'; });

async function init() {
  if (!DELIVERY_ID || !DRIVER_ID) {
    el('content').innerHTML = '<div class="err">⚠️ Invalid driver link.<br>Ask the office for a new link with your delivery code.</div>';
    return;
  }
  try {
    const res = await fetch(SCRIPT_URL + '?action=cfDriverView&deliveryId=' + encodeURIComponent(DELIVERY_ID)
                + '&driverId=' + encodeURIComponent(DRIVER_ID) + '&ts=' + Date.now());
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Could not load');
    _delivery = json.delivery;
    _stops = json.stops || [];
    render();
  } catch (e) {
    el('content').innerHTML = '<div class="err">⚠️ ' + esc(e.message) + '</div>'
      + '<button class="big-btn btn-start" onclick="init()">↻ Retry</button>';
  }
}

function render() {
  const d = _delivery;
  const stopsHtml = _stops.length ? _stops.map(s => `
    <div class="stop">
      <div class="stop-num">${s.seq||'•'}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;">${esc(s.label||'Stop')}</div>
        <div style="font-size:0.78rem;color:var(--muted);">${esc(s.address||'')}</div>
        ${s.lat&&s.lng?`<a class="maplink" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank">🧭 Navigate</a>`:''}
      </div>
    </div>`).join('') : '';

  const destNav = (d.destLat && d.destLng)
    ? `<a class="maplink" href="https://www.google.com/maps/dir/?api=1&destination=${d.destLat},${d.destLng}" target="_blank">🧭 Navigate to venue</a>` : '';

  el('content').innerHTML = `
    <div class="status-card">
      <div><span class="pulse-dot" id="liveDot"></span><span class="status-text" id="statusText">Not sharing location</span></div>
      <div class="status-sub" id="statusSub">Tap start when you begin the trip</div>
      <div class="gps-readout" id="gpsReadout"></div>
    </div>

    <button class="big-btn btn-start" id="toggleBtn" onclick="toggleTracking()">▶ Start Sharing Location</button>

    <div class="info-row">
      <div class="info-label">Delivery</div>
      <div class="info-value">${esc(d.id)} · ${esc(d.status||'')}</div>
    </div>
    <div class="info-row">
      <div class="info-label">Client / Event</div>
      <div class="info-value">${esc(d.clientName||d.eventRef||'—')}</div>
    </div>
    ${d.destAddress?`<div class="info-row"><div class="info-label">Destination</div><div class="info-value">${esc(d.destAddress)}</div>${destNav}</div>`:''}
    ${d.scheduledDeparture?`<div class="info-row"><div class="info-label">Scheduled Departure</div><div class="info-value">${esc(d.scheduledDeparture)}</div></div>`:''}
    ${d.vehicleName?`<div class="info-row"><div class="info-label">Vehicle</div><div class="info-value">${esc(d.vehicleName)}</div></div>`:''}

    ${stopsHtml?`<div class="section-title">📍 Stops</div>${stopsHtml}`:''}
  `;
}

function toggleTracking() {
  _tracking ? stopTracking() : startTracking();
}

function startTracking() {
  if (!('geolocation' in navigator)) {
    alert('This device does not support GPS.');
    return;
  }
  _tracking = true;
  el('toggleBtn').textContent = '⏸ Stop Sharing';
  el('toggleBtn').className = 'big-btn btn-stop';
  el('liveDot').classList.add('live');
  el('statusText').textContent = 'Sharing location…';
  el('statusSub').textContent = 'Keep this screen open while driving';

  // Continuous high-accuracy watch keeps a fresh fix in _lastFix
  _watchId = navigator.geolocation.watchPosition(
    pos => {
      _lastFix = pos.coords;
      el('gpsReadout').textContent =
        pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5)
        + '  ±' + Math.round(pos.coords.accuracy) + 'm';
    },
    err => {
      el('statusSub').textContent = '⚠️ ' + err.message + ' — check location permission';
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );

  // Send the latest fix every UPDATE_MS
  sendPosition(); // immediate first send
  _sendTimer = setInterval(sendPosition, UPDATE_MS);
}

function stopTracking() {
  _tracking = false;
  if (_watchId !== null) { navigator.geolocation.clearWatch(_watchId); _watchId = null; }
  if (_sendTimer) { clearInterval(_sendTimer); _sendTimer = null; }
  el('toggleBtn').textContent = '▶ Start Sharing Location';
  el('toggleBtn').className = 'big-btn btn-start';
  el('liveDot').classList.remove('live');
  el('statusText').textContent = 'Not sharing location';
  el('statusSub').textContent = 'Tap start when you resume the trip';
}

function sendPosition() {
  if (!_lastFix) return;
  const c = _lastFix;
  const url = SCRIPT_URL + '?action=cfLogPosition'
    + '&deliveryId=' + encodeURIComponent(DELIVERY_ID)
    + '&driverId='   + encodeURIComponent(DRIVER_ID)
    + '&lat=' + c.latitude + '&lng=' + c.longitude
    + '&speed=' + (c.speed||0) + '&accuracy=' + (c.accuracy||0)
    + '&ts=' + Date.now();
  fetch(url).then(r=>r.json()).then(j=>{
    if (j.success) {
      el('statusSub').textContent = 'Last sent ' + new Date().toLocaleTimeString();
    } else {
      el('statusSub').textContent = '⚠️ ' + (j.error||'send failed');
    }
  }).catch(()=>{ el('statusSub').textContent = '⚠️ offline — will retry'; });
}

// Keep sending in background where the browser allows it
document.addEventListener('visibilitychange', ()=>{ if (_tracking && !document.hidden) sendPosition(); });

init();
</script>
</body>
</html>
