<title>Appetina Admin — Booking Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0a06;
  --surface:#1a110a;
  --card:#221509;
  --border:#3a2210;
  --border2:#4d2e14;
  --brown:#8B4513;
  --gold:#C9A84C;
  --gold2:#e8c96a;
  --cream:#f5ede2;
  --text:#f0e6d8;
  --muted:#9e7e60;
  --green:#2E7D32;
  --blue:#1565C0;
  --red:#C62828;
  --purple:#4A148C;
  --new:#1565C0;
  --confirmed:#2E7D32;
  --cancelled:#C62828;
  --done:#4A148C;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── LOGIN ── */
#loginScreen{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;
  background-image:radial-gradient(ellipse at 30% 20%, rgba(139,69,19,0.15) 0%, transparent 60%),
                   radial-gradient(ellipse at 70% 80%, rgba(201,168,76,0.08) 0%, transparent 60%);
}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2.5rem 2.5rem 2rem;width:360px;text-align:center;}
.login-logo{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--gold);margin-bottom:0.25rem;}
.login-sub{font-size:0.8rem;color:var(--muted);margin-bottom:2rem;letter-spacing:0.12em;text-transform:uppercase;}
.login-input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:8px;padding:0.75rem 1rem;color:var(--text);font-size:0.95rem;font-family:inherit;margin-bottom:1rem;outline:none;transition:border-color 0.2s;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;background:var(--brown);color:#fff;border:none;border-radius:8px;padding:0.8rem;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.2s;}
.login-btn:hover{background:#a0521a;}
.login-err{color:#ff6b6b;font-size:0.82rem;margin-top:0.5rem;min-height:1.2rem;}

/* ── LAYOUT ── */
#app{display:none;min-height:100vh;}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border2);
  padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.topbar-brand{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);display:flex;align-items:center;gap:0.6rem;}
.topbar-brand span{font-size:0.7rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;border-left:1px solid var(--border2);padding-left:0.6rem;}
.topbar-right{display:flex;align-items:center;gap:1rem;}
.refresh-btn{background:var(--card);border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:0.4rem 0.9rem;font-size:0.8rem;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:0.4rem 0.8rem;font-size:0.8rem;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.logout-btn:hover{border-color:var(--red);color:#ff6b6b;}

.main{padding:1.5rem;}

/* ── STATS ROW ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;}
.stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:0.4rem;}
.stat-value{font-size:1.8rem;font-weight:700;font-family:'Playfair Display',serif;color:var(--gold);}
.stat-sub{font-size:0.75rem;color:var(--muted);margin-top:0.15rem;}

/* ── FILTERS ── */
.filter-bar{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.2rem;flex-wrap:wrap;}
.filter-search{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:0.6rem 1rem;color:var(--text);font-size:0.88rem;font-family:inherit;outline:none;}
.filter-search:focus{border-color:var(--gold);}
.filter-select{background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:0.6rem 0.9rem;color:var(--text);font-size:0.83rem;font-family:inherit;cursor:pointer;outline:none;}
.filter-select:focus{border-color:var(--gold);}
.filter-count{font-size:0.8rem;color:var(--muted);white-space:nowrap;}

/* ── TABLE ── */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.83rem;}
thead tr{background:var(--card);border-bottom:1px solid var(--border2);}
th{padding:0.75rem 0.9rem;text-align:left;font-weight:600;color:var(--muted);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(139,69,19,0.08);}
td{padding:0.7rem 0.9rem;vertical-align:middle;}
.td-ref{font-family:monospace;font-size:0.78rem;color:var(--gold);font-weight:600;}
.td-name{font-weight:600;color:var(--text);}
.td-date{white-space:nowrap;color:var(--cream);}
.td-price{font-weight:700;color:var(--gold2);white-space:nowrap;}
.td-muted{color:var(--muted);}

/* ── STATUS BADGE ── */
.status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700;letter-spacing:0.06em;white-space:nowrap;}
.s-NEW{background:#1565C0;color:#fff;}
.s-Confirmed{background:#2E7D32;color:#fff;}
.s-Cancelled{background:#C62828;color:#fff;}
.s-Done{background:#4A148C;color:#fff;}

/* ── RECEIPT THUMB ── */
.receipt-link{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-size:0.78rem;text-decoration:none;border:1px solid var(--border2);border-radius:4px;padding:2px 8px;}
.receipt-link:hover{border-color:var(--gold);}
.no-receipt{color:var(--muted);font-size:0.75rem;}

/* ── DETAIL MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:720px;animation:slideUp 0.25s ease;}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1;padding:0;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:1.25rem 1.5rem;}
.detail-section{margin-bottom:1.25rem;}
.detail-section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--gold);font-weight:600;margin-bottom:0.7rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border);}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.5rem 1rem;}
.detail-item label{display:block;font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;}
.detail-item span{font-size:0.88rem;color:var(--text);}
.detail-item span.val-big{font-size:1.1rem;font-weight:700;color:var(--gold2);}
.detail-item span.val-down{color:#ff6b6b;font-weight:600;}

.status-row{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;padding:1rem 1.5rem;background:var(--card);border-top:1px solid var(--border);}
.status-row label{font-size:0.78rem;color:var(--muted);white-space:nowrap;}
.status-select{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:0.45rem 0.8rem;color:var(--text);font-size:0.85rem;font-family:inherit;cursor:pointer;outline:none;}
.save-status-btn{background:var(--brown);color:#fff;border:none;border-radius:6px;padding:0.45rem 1rem;font-size:0.83rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.2s;}
.save-status-btn:hover{background:#a0521a;}
.save-status-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* Receipt image preview in modal */
.receipt-preview{margin-top:0.6rem;}
.receipt-img-wrap{
  position:relative;cursor:zoom-in;display:inline-block;
  border-radius:10px;overflow:hidden;border:1px solid var(--border2);
  width:100%;background:var(--card);
}
.receipt-img-wrap img{
  width:100%;max-height:380px;object-fit:contain;display:block;
  transition:transform 0.2s;
}
.receipt-img-wrap:hover img{transform:scale(1.02);}
.receipt-img-zoom{
  position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);
  color:#fff;border-radius:6px;padding:4px 8px;font-size:0.72rem;
  backdrop-filter:blur(4px);pointer-events:none;
}
.receipt-open-btn{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--gold);font-size:0.83rem;
  border:1px solid var(--border2);border-radius:6px;
  padding:0.45rem 1rem;text-decoration:none;margin-top:0.6rem;
  transition:border-color 0.2s;
}
.receipt-open-btn:hover{border-color:var(--gold);}
.no-receipt-box{
  background:var(--card);border:1px dashed var(--border2);border-radius:8px;
  padding:1.5rem;text-align:center;color:var(--muted);font-size:0.85rem;
}

/* Lightbox */
#lightbox{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);
  z-index:500;align-items:center;justify-content:center;cursor:zoom-out;
}
#lightbox.open{display:flex;}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;object-fit:contain;box-shadow:0 8px 60px rgba(0,0,0,0.8);}
#lightbox-close{position:absolute;top:1rem;right:1.2rem;color:#fff;font-size:2rem;cursor:pointer;line-height:1;background:rgba(0,0,0,0.5);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;}

/* Table receipt thumbnail */
.receipt-thumb{width:36px;height:36px;border-radius:5px;object-fit:cover;border:1px solid var(--border2);cursor:pointer;vertical-align:middle;}
.receipt-link{display:inline-flex;align-items:center;gap:4px;color:var(--gold);font-size:0.78rem;text-decoration:none;border:1px solid var(--border2);border-radius:4px;padding:2px 8px;}
.receipt-link:hover{border-color:var(--gold);}
.no-receipt{color:var(--muted);font-size:0.75rem;}

/* ── LOADING / EMPTY ── */
.loading-state,.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);}
.spinner-lg{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-icon{font-size:2.5rem;margin-bottom:0.75rem;}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface);border:1px solid var(--border2);border-radius:8px;padding:0.75rem 1.2rem;font-size:0.85rem;z-index:999;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.gold{border-color:var(--gold);color:var(--gold);}
.toast.red{border-color:#ff6b6b;color:#ff6b6b;}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .topbar{padding:0 1rem;}
  .main{padding:1rem;}
  th,td{padding:0.6rem 0.7rem;}
  .modal{border-radius:10px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

              <th>Balance</th><th>Receipt</th><th>Submitted</th>

          </thead>

<script>
// ── CONFIG ─────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgiIM1LfbujitaT3an4egn1NS9bH5Ll3FmjtiHaohmLNHtl0EV1fuB5W-InqNdUUvI/exec';
const ADMIN_PASS = 'appetina2024'; // must match Apps Script

let allBookings = [];
let currentRef  = null;
let sessionPass = '';

// ── LOGIN ──────────────────────────────────────────────────────
function doLogin() {
  const p = document.getElementById('passInput').value.trim();
  if (p === ADMIN_PASS) {
    sessionPass = p;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadBookings();
  } else {
    document.getElementById('loginErr').textContent = 'Incorrect password. Please try again.';
    document.getElementById('passInput').value = '';
  }
}

function logout() {
  sessionPass = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('passInput').value = '';
  document.getElementById('loginErr').textContent = '';
}

// ── LOAD BOOKINGS ──────────────────────────────────────────────
async function loadBookings() {
  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="11"><div class="loading-state"><div class="spinner-lg"></div>Loading bookings…</div></td></tr>';
  try {
    const url = SCRIPT_URL + '?action=list&pass=' + encodeURIComponent(sessionPass);
    const res  = await fetch(url);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Failed');
    allBookings = json.bookings || [];
    updateStats();
    applyFilters();
    showToast('✓ Loaded ' + allBookings.length + ' bookings', 'gold');
  } catch(e) {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="11"><div class="empty-state"><div class="empty-icon">⚠️</div>Could not load bookings.<br><small>' + e.message + '</small></div></td></tr>';
    showToast('Error loading bookings', 'red');
  }
}

// ── STATS ──────────────────────────────────────────────────────
function updateStats() {
  const tot  = allBookings.length;
  const nNew = allBookings.filter(b=>b['Status']==='NEW').length;
  const nConf= allBookings.filter(b=>b['Status']==='Confirmed').length;
  const rev  = allBookings.filter(b=>b['Status']==='Confirmed').reduce((s,b)=>s+(+b['Total (₱)']||0),0);
  const bal  = allBookings.filter(b=>b['Status']!=='Cancelled').reduce((s,b)=>s+(+b['Balance (₱)']||0),0);
  document.getElementById('sTot').textContent  = tot;
  document.getElementById('sNew').textContent  = nNew;
  document.getElementById('sConf').textContent = nConf;
  document.getElementById('sRev').textContent  = '₱' + rev.toLocaleString();
  document.getElementById('sBal').textContent  = '₱' + bal.toLocaleString();
}

// ── FILTERS ───────────────────────────────────────────────────
function applyFilters() {
  const q  = (document.getElementById('searchInput').value||'').toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const ev = document.getElementById('eventFilter').value;
  let rows = allBookings.filter(b => {
    const hay = [b['Booking Ref'],b['Client Name'],b['Venue'],b['Event Type'],b['Occasion'],b['Contact']].join(' ').toLowerCase();
    return (!q || hay.includes(q)) &&
           (!st || b['Status']===st) &&
           (!ev || (b['Event Type']||'').toLowerCase().includes(ev.toLowerCase()));
  });
  document.getElementById('filterCount').textContent = rows.length + ' booking' + (rows.length!==1?'s':'') + ' shown';
  renderTable(rows);
}

// ── RENDER TABLE ───────────────────────────────────────────────
function renderTable(rows) {
  if (!rows.length) {
    document.getElementById('tableBody').innerHTML =
      '<tr><td colspan="11"><div class="empty-state"><div class="empty-icon">📋</div>No bookings match your filters.</div></td></tr>';
    return;
  }
  document.getElementById('tableBody').innerHTML = rows.map((b,i) => {
    const st  = b['Status'] || 'NEW';
    const total= +b['Total (₱)'] || 0;
    const down = +b['Downpayment (₱)'] || 0;
    const bal  = +b['Balance (₱)'] || 0;
    const receipt = getReceiptUrl(b);
    const receiptHtml = receipt
      ? `<img class="receipt-thumb" src="${receipt}" alt="receipt"
           onclick="event.stopPropagation();openLightbox('${receipt}')"
           onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"/>
         <a class="receipt-link" href="${receipt}" target="_blank"
            onclick="event.stopPropagation()" style="display:none">🖼 View</a>`
      : `<span class="no-receipt">—</span>`;
    return `<tr onclick="openModal(${i})">
      <td><span class="td-ref">${b['Booking Ref']||'—'}</span></td>
      <td><span class="status-badge s-${st}">${st}</span></td>
      <td><div class="td-name">${b['Client Name']||'—'}</div><div class="td-muted" style="font-size:0.75rem;">${b['Contact']||''}</div></td>
      <td class="td-date">${b['Event Date']||'—'}</td>
      <td class="td-muted">${b['Event Type']||'—'}</td>
      <td class="td-muted">${b['No. of Pax']||'—'}</td>
      <td class="td-price">₱${total.toLocaleString()}</td>
      <td style="color:#ff6b6b;font-weight:600;">₱${down.toLocaleString()}</td>
      <td class="td-muted">₱${bal.toLocaleString()}</td>
      <td>${receiptHtml}</td>
      <td class="td-muted" style="font-size:0.75rem;">${(b['Timestamp']||'').split(',')[0]||'—'}</td>
    </tr>`;
  }).join('');

  // Store filtered rows globally for modal navigation
  window._filteredRows = rows;
}

// ── MODAL ──────────────────────────────────────────────────────
function openModal(idx) {
  const rows = window._filteredRows || allBookings;
  const b = rows[idx];
  if (!b) return;
  currentRef = b['Booking Ref'];
  window._modalBooking = b;

  document.getElementById('modalTitle').textContent = b['Booking Ref'] + ' — ' + b['Client Name'];
  document.getElementById('statusSelect').value = b['Status'] || 'NEW';

  const total= +b['Total (₱)'] || 0;
  const down = +b['Downpayment (₱)'] || 0;
  const bal  = +b['Balance (₱)'] || 0;

  const receiptUrl = getReceiptUrl(b);
  const receiptSection = receiptUrl
    ? `<div class="receipt-preview">
        <div class="receipt-img-wrap" onclick="openLightbox('${receiptUrl}')">
          <img src="${receiptUrl}" alt="Payment Receipt"
               onerror="this.parentElement.innerHTML='<div style=\\'padding:1rem;color:var(--muted);text-align:center;font-size:0.85rem;\\'>⚠️ Image could not load.<br><a href=\\'${receiptUrl}\\' target=\\'_blank\\' style=\\'color:var(--gold)\\'>Open in new tab →</a></div>'"/>
          <div class="receipt-img-zoom">🔍 Click to enlarge</div>
        </div>
        <a class="receipt-open-btn" href="${receiptUrl}" target="_blank">
          ↗ Open full image in new tab
        </a>
      </div>`
    : `<div class="no-receipt-box">
        <div style="font-size:1.5rem;margin-bottom:0.4rem;">🧾</div>
        No receipt uploaded for this booking.
      </div>`;

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-section">
      <div class="detail-section-title">👤 Client Information</div>
      <div class="detail-grid">
        <div class="detail-item"><label>Name</label><span>${b['Client Name']||'—'}</span></div>
        <div class="detail-item"><label>Contact</label><span>${b['Contact']||'—'}</span></div>
        <div class="detail-item"><label>Email</label><span>${b['Email']||'—'}</span></div>
        <div class="detail-item"><label>Submitted</label><span>${b['Timestamp']||'—'}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">🎊 Event Details</div>
      <div class="detail-grid">
        <div class="detail-item"><label>Event Type</label><span>${b['Event Type']||'—'}</span></div>
        <div class="detail-item"><label>Occasion</label><span>${b['Occasion']||'—'}</span></div>
        <div class="detail-item"><label>Date</label><span>${b['Event Date']||'—'}</span></div>
        <div class="detail-item"><label>Time</label><span>${b['Event Time']||'—'}</span></div>
        <div class="detail-item" style="grid-column:1/-1"><label>Venue</label><span>${b['Venue']||'—'}</span></div>
        <div class="detail-item"><label>Color Motif</label><span>${b['Color Motif']||'—'}</span></div>
        <div class="detail-item"><label>No. of Pax</label><span>${b['No. of Pax']||'—'}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">💰 Pricing</div>
      <div class="detail-grid">
        <div class="detail-item"><label>Package</label><span>${b['Package']||'—'}</span></div>
        <div class="detail-item"><label>Total</label><span class="val-big">₱${total.toLocaleString()}</span></div>
        <div class="detail-item"><label>Downpayment (50%)</label><span class="val-down">₱${down.toLocaleString()}</span></div>
        <div class="detail-item"><label>Balance Due</label><span>₱${bal.toLocaleString()}</span></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-section-title">🍽️ Menu Selection</div>
      <div class="detail-grid">
        <div class="detail-item"><label>Beef</label><span>${b['Beef']||'—'}</span></div>
        <div class="detail-item"><label>Fish</label><span>${b['Fish']||'—'}</span></div>
        <div class="detail-item"><label>Chicken</label><span>${b['Chicken']||'—'}</span></div>
        <div class="detail-item"><label>Veggie</label><span>${b['Veggie']||'—'}</span></div>
        <div class="detail-item"><label>Pasta</label><span>${b['Pasta']||'—'}</span></div>
        <div class="detail-item"><label>Desserts</label><span>${b['Desserts']||'—'}</span></div>
        <div class="detail-item"><label>Drinks</label><span>${b['Drinks']||'—'}</span></div>
        <div class="detail-item"><label>🐷 Lechon</label><span style="color:${b['Lechon']&&b['Lechon'].includes('Yes')?'var(--gold)':'var(--muted)'}">${b['Lechon']||'No'}</span></div>
      </div>
    </div>
    ${b['Addon Orders'] && b['Addon Orders']!=='None' ? `
    <div class="detail-section">
      <div class="detail-section-title">➕ Additional Orders</div>
      <div style="font-size:0.85rem;color:var(--cream);line-height:1.8;">${(b['Addon Orders']||'').split(' | ').map(a=>'• '+a).join('<br>')}</div>
    </div>` : ''}
    ${b['Special Notes'] ? `
    <div class="detail-section">
      <div class="detail-section-title">📝 Special Notes</div>
      <div style="font-size:0.85rem;color:var(--cream);background:var(--card);border-radius:6px;padding:0.75rem 1rem;">${b['Special Notes']}</div>
    </div>` : ''}
    <div class="detail-section">
      <div class="detail-section-title">🧾 Payment Receipt</div>
      ${receiptSection}
    </div>
  `;

  document.getElementById('modalOverlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  document.body.style.overflow = '';
  currentRef = null;
}

// ── UPDATE STATUS ──────────────────────────────────────────────
async function saveStatus() {
  if (!currentRef) return;
  const status = document.getElementById('statusSelect').value;
  const btn = document.getElementById('saveStatusBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const url = SCRIPT_URL + '?action=updateStatus&pass=' + encodeURIComponent(sessionPass) +
                '&ref=' + encodeURIComponent(currentRef) + '&status=' + encodeURIComponent(status);
    const res  = await fetch(url);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Failed');
    // Update local data
    const b = allBookings.find(x => x['Booking Ref'] === currentRef);
    if (b) b['Status'] = status;
    updateStats();
    applyFilters();
    showToast('✓ Status updated to ' + status, 'gold');
    closeModal();
  } catch(e) {
    showToast('Failed to update status', 'red');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Status';
  }
}

// ── TOAST ──────────────────────────────────────────────────────
function showToast(msg, type='gold') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 3000);
}

// Extract actual Cloudinary URL — handles plain URL or leftover formula text
function getReceiptUrl(b) {
  const raw = b['Receipt Link'] || '';
  if (!raw) return '';
  // If it's already a proper URL, return as-is
  if (raw.startsWith('http')) return raw;
  // If it's a HYPERLINK formula text, extract the URL
  const match = raw.match(/HYPERLINK\("([^"]+)"/i);
  if (match) return match[1];
  return '';
}
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxImg').src = '';
  // restore scroll only if modal is also closed
  if (!currentRef) document.body.style.overflow = '';
}

// Keyboard close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('open')) closeLightbox();
    else closeModal();
  }
});
</script>
</body>
</html>
